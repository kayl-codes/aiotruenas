name: SonarQube (PR analysis)

# Runs the SonarQube scan for pull requests, including ones from forks.
#
# PRs from forks never get repo secrets when triggered directly via
# `pull_request` (see build.yml's `prepare-pr-analysis` job, which only
# builds a coverage report + PR metadata artifact there, without SONAR_TOKEN).
# This workflow is triggered by `workflow_run` instead, which always executes
# using the workflow file from the base repo's default branch - a fork PR
# cannot alter what this job does. It only ever downloads the artifact and
# checks out the PR's already-tested source for static analysis; it never
# installs dependencies from or executes code from the fork.
on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download PR analysis data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-pr-data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/sonar-pr-data

      - name: Load and validate PR metadata
        # pr.env comes from prepare-pr-analysis, a job that runs the fork's own
        # test suite - it must be treated as untrusted. Never `cat` it straight
        # into $GITHUB_ENV: extract only the expected keys and reject anything
        # that doesn't match a strict, injection-safe shape before this
        # (secret-bearing) job's environment is allowed to see it.
        run: |
          set -euo pipefail
          metadata="${{ runner.temp }}/sonar-pr-data/pr.env"

          get_value() {
            awk -F= -v key="$1" '$1 == key { print substr($0, length(key) + 2); exit }' "$metadata"
          }

          pr_number=$(get_value PR_NUMBER)
          pr_head_ref=$(get_value PR_HEAD_REF)
          pr_base_ref=$(get_value PR_BASE_REF)

          [[ "$pr_number" =~ ^[0-9]+$ ]] || { echo "::error::invalid or missing PR_NUMBER in pr.env"; exit 1; }
          [[ "$pr_head_ref" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::invalid or missing PR_HEAD_REF in pr.env"; exit 1; }
          [[ "$pr_base_ref" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::invalid or missing PR_BASE_REF in pr.env"; exit 1; }

          echo "PR_NUMBER=$pr_number" >> "$GITHUB_ENV"
          echo "PR_HEAD_REF=$pr_head_ref" >> "$GITHUB_ENV"
          echo "PR_BASE_REF=$pr_base_ref" >> "$GITHUB_ENV"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          persist-credentials: false
          # checkout refuses fork-PR refs in a workflow_run job by default (the
          # "pwn request" guard - see https://gh.io/securely-using-pull_request_target),
          # since a fork's sonar-project.properties is PR-author-controlled and
          # could otherwise redirect this job's SONAR_TOKEN-bearing traffic
          # (e.g. via sonar.host.url) to an attacker's server. We neutralize
          # that below by pinning the properties file to the trusted base ref
          # and hard-forcing sonar.host.url via -D (which always outranks the
          # properties file), so allow-unsafe-pr-checkout only ever exposes
          # the PR's source *text* to the (non-executing) scanner, never its
          # config.
          #
          # WARNING for future editors: this safety argument holds only as
          # long as no step in this job installs dependencies from, builds,
          # or otherwise executes the checked-out PR code (the classic pwn
          # request pattern). If you add such a step, re-litigate whether
          # allow-unsafe-pr-checkout is still safe here first.
          allow-unsafe-pr-checkout: true

      - name: Restore coverage report
        run: cp "${{ runner.temp }}/sonar-pr-data/coverage.xml" coverage.xml

      - name: Pin sonar-project.properties to the trusted base ref
        # The fork's copy of this file is attacker-controlled and must never
        # configure a job that holds SONAR_TOKEN (e.g. via sonar.host.url,
        # proxy settings, exclusions). Overwrite it with the base branch's
        # version before scanning; only the PR's source/test files (the
        # intended scan target) come from the fork checkout. PR_BASE_REF is
        # passed via env: (not spliced into the script) even though it was
        # already regex-validated earlier - never template context values
        # directly into run: text.
        env:
          PR_BASE_REF: ${{ env.PR_BASE_REF }}
        run: git show "origin/$PR_BASE_REF:sonar-project.properties" > sonar-project.properties

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.pullrequest.key=${{ env.PR_NUMBER }}
            -Dsonar.pullrequest.branch=${{ env.PR_HEAD_REF }}
            -Dsonar.pullrequest.base=${{ env.PR_BASE_REF }}
