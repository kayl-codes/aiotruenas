name: SonarQube (PR analysis)

# Runs the SonarQube scan for pull requests, including ones from forks.
#
# PRs from forks never get repo secrets when triggered directly via
# `pull_request` (see build.yml's `prepare-pr-analysis` job, which only
# builds a coverage report + PR metadata artifact there, without SONAR_TOKEN).
# This workflow is triggered by `workflow_run` instead, which always executes
# using the workflow file from the base repo's default branch - a fork PR
# cannot alter what this job does. It only ever downloads the artifact and
# checks out the PR's already-tested source for static analysis; it never
# installs dependencies from or executes code from the fork. All `run:` steps
# come before that checkout (see the warning there).
on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Scans of one PR branch run one at a time and are never cancelled: a late
    # older run then waits, and the head check below makes it skip, while a
    # newer one waiting behind an older scan runs last. Only a third run
    # arriving out of order can still replace a waiting one (GitHub keeps one
    # pending run per group).
    concurrency:
      group: sonar-pr-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Download PR analysis data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-pr-data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/sonar-pr-data

      - name: Load and validate PR metadata
        # pr.env comes from prepare-pr-analysis, a job that runs the fork's own
        # test suite - it must be treated as untrusted. Never `cat` it straight
        # into $GITHUB_ENV: extract only the expected keys and reject anything
        # that doesn't match a strict, injection-safe shape before this
        # (secret-bearing) job's environment is allowed to see it.
        run: |
          set -euo pipefail
          metadata="${{ runner.temp }}/sonar-pr-data/pr.env"

          get_value() {
            awk -F= -v key="$1" '$1 == key { print substr($0, length(key) + 2); exit }' "$metadata"
          }

          pr_number=$(get_value PR_NUMBER)
          pr_head_ref=$(get_value PR_HEAD_REF)
          pr_base_ref=$(get_value PR_BASE_REF)

          [[ "$pr_number" =~ ^[0-9]+$ ]] || { echo "::error::invalid or missing PR_NUMBER in pr.env"; exit 1; }
          [[ "$pr_head_ref" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::invalid or missing PR_HEAD_REF in pr.env"; exit 1; }
          [[ "$pr_base_ref" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::invalid or missing PR_BASE_REF in pr.env"; exit 1; }

          echo "PR_NUMBER=$pr_number" >> "$GITHUB_ENV"
          echo "PR_HEAD_REF=$pr_head_ref" >> "$GITHUB_ENV"
          echo "PR_BASE_REF=$pr_base_ref" >> "$GITHUB_ENV"

      - name: Skip if the PR has moved on
        # Build runs can finish out of order, so an older run may reach this
        # job after a newer one. Checked before the checkout and the scan, so
        # only the PR's current head is analysed; with the queueing group above
        # an older analysis cannot replace a newer one. Transient API errors
        # are retried; an unreadable head SHA then fails the job instead of
        # skipping silently. The base and head refs are taken from the same API
        # reply and replace the ones from the untrusted pr.env, so the fork
        # cannot pick the branch the scan settings are read from, nor the
        # branch names the analysis is filed under.
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_sha=""
          base_ref=""
          head_ref=""
          for attempt in 1 2 3; do
            if pr_info=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha + " " + .base.ref + " " + .head.ref'); then
              read -r current_sha base_ref head_ref <<< "$pr_info"
              break
            fi
            echo "::warning::reading PR #$PR_NUMBER failed (attempt $attempt of 3)"
            if (( attempt < 3 )); then sleep $((attempt * 10)); fi
          done
          [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not read the head SHA of PR #$PR_NUMBER"; exit 1; }
          [[ "$base_ref" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::could not read the base ref of PR #$PR_NUMBER"; exit 1; }
          [[ "$head_ref" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::could not read the head ref of PR #$PR_NUMBER"; exit 1; }
          if [[ "$base_ref" != "$PR_BASE_REF" || "$head_ref" != "$PR_HEAD_REF" ]]; then
            echo "::warning::pr.env names $PR_HEAD_REF -> $PR_BASE_REF, the PR API $head_ref -> $base_ref; using the API values"
          fi
          echo "PR_BASE_REF=$base_ref" >> "$GITHUB_ENV"
          echo "PR_HEAD_REF=$head_ref" >> "$GITHUB_ENV"
          if [[ "$current_sha" == "$RUN_HEAD_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            reason="Skipping scan: $RUN_HEAD_SHA is no longer the head of PR #$PR_NUMBER ($current_sha)"
            echo "::notice::$reason"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare scan inputs outside the workspace
        # The fork's copy of sonar-project.properties is attacker-controlled
        # and must never configure a job that holds SONAR_TOKEN (e.g. via
        # sonar.host.url, proxy settings, exclusions). The scan reads the base
        # branch's version from outside the workspace instead (project.settings
        # below), and the coverage report straight from the artifact.
        # Runs before the checkout: no `run:` step may come after it.
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          coverage="$RUNNER_TEMP/sonar-pr-data/coverage.xml"
          if ! { [[ -s "$coverage" ]] && grep -q '<coverage' "$coverage"; }; then
            echo "::error::coverage.xml is missing, empty or not a coverage report in the PR analysis data"
            exit 1
          fi
          settings="$RUNNER_TEMP/sonar-project.properties"
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GITHUB_REPOSITORY/contents/sonar-project.properties?ref=$PR_BASE_REF" > "$settings"
          # Deliberately strict: our file uses plain `key=value` lines.
          for key in sonar.projectKey sonar.sources; do
            grep -q "^$key=[^[:space:]]" "$settings" || { echo "::error::sonar-project.properties of $PR_BASE_REF has no $key value"; exit 1; }
          done

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.head.outputs.current == 'true'
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          # The exact commit build.yml measured coverage on (its PR head), not
          # the moving refs/pull/N/head: after a further push that ref would
          # pair newer sources with the older run's coverage.xml.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          # checkout refuses fork-PR refs in a workflow_run job by default (the
          # "pwn request" guard - see https://gh.io/securely-using-pull_request_target).
          # Here the PR's files are only scan input: the scanner takes its
          # settings and coverage report from outside the workspace and has
          # sonar.host.url forced via -D (which always outranks any properties
          # file), so the PR cannot change the scan configuration or the target host
          # of its SONAR_TOKEN-bearing traffic.
          #
          # WARNING for future editors: this safety argument holds only as
          # long as no `run:` step comes after this checkout, and no later step
          # installs dependencies from, builds, or otherwise executes the
          # checked-out PR code (the classic pwn request pattern). Put new
          # `run:` steps before the checkout. If you must add one after it, re-litigate
          # whether allow-unsafe-pr-checkout is still safe here first.
          allow-unsafe-pr-checkout: true

      - name: SonarQube Scan
        if: steps.head.outputs.current == 'true'
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dproject.settings=${{ runner.temp }}/sonar-project.properties
            -Dsonar.python.coverage.reportPaths=${{ runner.temp }}/sonar-pr-data/coverage.xml
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.projectBaseDir=${{ github.workspace }}
            -Dsonar.pullrequest.key=${{ env.PR_NUMBER }}
            -Dsonar.pullrequest.branch=${{ env.PR_HEAD_REF }}
            -Dsonar.pullrequest.base=${{ env.PR_BASE_REF }}
