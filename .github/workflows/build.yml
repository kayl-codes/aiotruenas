name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: -e ".[dev]"
      - name: pytest with coverage
        run: pytest --cov=aiotruenas --cov-report=xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  prepare-pr-analysis:
    name: Prepare PR analysis data
    # PRs from forks don't get repo secrets, so SONAR_TOKEN is unavailable here.
    # This job only builds a coverage report and PR metadata as an artifact;
    # the actual scan runs in sonar-pr.yml (workflow_run), which executes in
    # the base repo's context and has access to secrets, without ever running
    # code checked out from the fork.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: -e ".[dev]"
      - name: pytest with coverage
        run: pytest --cov=aiotruenas --cov-report=xml
      - name: Write PR metadata
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> pr.env
          echo "PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> pr.env
          echo "PR_HEAD_REF=${{ github.event.pull_request.head.ref }}" >> pr.env
          echo "PR_BASE_REF=${{ github.event.pull_request.base.ref }}" >> pr.env
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-pr-data
          path: |
            coverage.xml
            pr.env
          retention-days: 1
